<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanban Board · nowii-core</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ SPLASH ============ -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="6" height="18" rx="1.5"/>
          <rect x="10.5" y="3" width="6" height="12" rx="1.5"/>
          <rect x="18" y="3" width="6" height="15" rx="1.5"/>
        </svg>
      </div>
      <h1 class="splash-title">nowii<span>·</span>board</h1>
      <div class="splash-bar"><span></span></div>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app">

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="6" height="18" rx="1.5"/>
              <rect x="10.5" y="3" width="6" height="12" rx="1.5"/>
              <rect x="18" y="3" width="6" height="15" rx="1.5"/>
            </svg>
          </span>
          <span class="brand-name">nowii<span>·</span>board</span>
        </div>
        <span class="board-name" id="boardName" contenteditable="true" spellcheck="false">Il mio progetto</span>
      </div>

      <div class="header-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Cerca card… (Ctrl+K)" />
        </div>

        <button class="icon-btn" id="filterBtn" title="Filtra per priorità">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          <span class="filter-dot" id="filterDot" hidden></span>
        </button>

        <button class="icon-btn" id="themeBtn" title="Cambia tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>

        <button class="icon-btn" id="statsBtn" title="Statistiche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        </button>
      </div>
    </header>

    <!-- BOARD -->
    <main class="board-wrap">
      <div class="board" id="board"></div>

      <div class="list-creator" id="listCreator">
        <button class="add-list-btn" id="addListBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Aggiungi lista
        </button>
        <div class="list-creator-form" id="listCreatorForm" hidden>
          <input type="text" id="newListInput" placeholder="Nome della lista…" maxlength="40" autocomplete="off" />
          <div class="inline-actions">
            <button class="mini-btn primary" id="newListAdd">Aggiungi</button>
            <button class="mini-btn" id="newListCancel">Annulla</button>
          </div>
        </div>
      </div>
    </main>

  </div>

  <!-- ============ MODAL CARD ============ -->
  <div class="modal-backdrop" id="cardBackdrop" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle">
    <div class="modal modal-card">
      <header class="modal-head">
        <div class="card-modal-head">
          <span class="card-modal-list" id="cardModalList">In corso</span>
          <h2 id="cardModalTitle" contenteditable="true" spellcheck="false">Titolo card</h2>
        </div>
        <button class="icon-btn" id="cardClose" aria-label="Chiudi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="modal-body card-modal-body">
        <div class="card-modal-section">
          <label class="section-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            Descrizione
          </label>
          <textarea id="cardDesc" rows="4" placeholder="Aggiungi una descrizione…"></textarea>
        </div>

        <div class="card-modal-row">
          <div class="card-modal-section">
            <label class="section-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20"/></svg>
              Priorità
            </label>
            <div class="priority-picker" id="priorityPicker">
              <button data-priority="low">Bassa</button>
              <button data-priority="medium" class="active">Media</button>
              <button data-priority="high">Alta</button>
            </div>
          </div>

          <div class="card-modal-section">
            <label class="section-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              Scadenza
            </label>
            <input type="date" id="cardDue" class="date-input" />
          </div>
        </div>

        <div class="card-modal-section">
          <label class="section-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>
            Tag
          </label>
          <div class="tags-input" id="tagsInput">
            <div class="tag-list" id="cardTags"></div>
            <input type="text" id="tagInput" placeholder="Aggiungi tag + Invio" maxlength="20" autocomplete="off" />
          </div>
        </div>

        <div class="card-modal-section">
          <label class="section-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            Checklist
          </label>
          <div class="checklist-progress">
            <div class="progress-bar"><span id="checklistBar"></span></div>
            <small id="checklistText">0/0</small>
          </div>
          <div class="checklist" id="checklist"></div>
          <div class="checklist-add">
            <input type="text" id="checklistInput" placeholder="Nuovo elemento…" maxlength="80" autocomplete="off" />
            <button class="mini-btn" id="checklistAdd">Aggiungi</button>
          </div>
        </div>
      </div>

      <footer class="modal-foot">
        <button class="action-btn danger" id="cardDelete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          Elimina
        </button>
        <button class="action-btn primary" id="cardSave">Salva</button>
      </footer>
    </div>
  </div>

  <!-- ============ MODAL STATISTICHE ============ -->
  <div class="modal-backdrop" id="statsBackdrop" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
    <div class="modal modal-small">
      <header class="modal-head">
        <h2 id="statsTitle">Statistiche board</h2>
        <button class="icon-btn" id="statsClose" aria-label="Chiudi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="modal-body stats-body" id="statsBody"></div>
    </div>
  </div>

  <!-- ============ MODAL CONFERMA ============ -->
  <div class="modal-backdrop" id="confirmBackdrop" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal modal-small modal-confirm">
      <div class="confirm-icon" id="confirmIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01"/>
        </svg>
      </div>
      <h2 id="confirmTitle">Sei sicuro?</h2>
      <p class="confirm-message" id="confirmMessage">Questa azione non può essere annullata.</p>
      <div class="confirm-actions">
        <button class="action-btn" id="confirmCancel">Annulla</button>
        <button class="action-btn danger-solid" id="confirmOk">Conferma</button>
      </div>
    </div>
  </div>

  <!-- ============ CONTEXT MENU ============ -->
  <div class="context-menu" id="contextMenu">
    <button data-action="rename">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Rinomina lista
    </button>
    <button data-action="duplicate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Duplica lista
    </button>
    <button data-action="clear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
      Svuota lista
    </button>
    <button data-action="delete" class="danger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      Elimina lista
    </button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
